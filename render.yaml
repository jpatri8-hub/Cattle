services:
  - type: web
    name: cattle-manager
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cattle-manager-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.3

databases:
  - name: cattle-manager-db
    plan: basic-256mb
