{% extends "base.html" %}
{% block title %}Users - Cattle Manager{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Users</h2>
  <a href="{{ url_for('auth.new_user') }}" class="btn btn-success">+ New User</a>
</div>
<table class="table table-striped bg-white">
  <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th></th></tr></thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.name }}</td>
      <td>{{ u.email }}</td>
      <td><span class="badge bg-secondary">{{ u.role }}</span></td>
      <td>{{ "Yes" if u.is_active_user else "No" }}</td>
      <td><a href="{{ url_for('auth.edit_user', user_id=u.id) }}" class="btn btn-sm btn-outline-primary">Edit</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
