{% extends "base.html" %}
{% block title %}Edit Property - Cattle Manager{% endblock %}
{% block content %}
<h2>Edit Property</h2>
<form method="post" class="card card-dashboard p-4" novalidate>
  {{ form.hidden_tag() }}
  <div class="mb-3">{{ form.name.label(class="form-label") }} {{ form.name(class="form-control") }}</div>
  {{ form.submit(class="btn btn-success") }}
  <a href="{{ url_for('admin.properties') }}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
